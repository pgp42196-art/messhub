# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
# Database is external (Neon); paste its connection string as DATABASE_URL.
services:
  - type: web
    name: messhub
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PG_POOL
        value: "10"
      - key: DATABASE_URL
        sync: false   # Neon connection string (ends with ?sslmode=require)
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_PASSWORD
        sync: false
